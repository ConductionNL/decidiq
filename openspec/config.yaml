schema: conduction

context: |
  Project: Decidiq
  Repo: ConductionNL/decidiq
  Type: Nextcloud App (PHP backend + Vue 2 frontend)
  Description: Universal decision-making platform for governance bodies — manages meetings, agendas, motions, amendments, voting, minutes, and decision tracking with configurable workflows per organization type.
  Key components: Dashboard, Meeting Management, Agenda Builder, Motion/Voting, Minutes/Decisions, Governance Bodies, Citizen Participation
  Database: PostgreSQL (via OpenRegister's ObjectService)
  Mount path: /var/www/html/custom_apps/decidiq

  Governance Domains:
    1. Legislative/democratic bodies (municipalities, provinces, water boards)
    2. Associations and NGOs (member assemblies, board meetings)
    3. Corporate governance (shareholders, supervisory boards)
    4. Corporate operations (management teams, project boards)
    5. Citizen participation (initiatives, referenda, participatory budgets)

  Architecture:
    Pattern: Thin client — Decidiq owns no database tables
    Data layer: OpenRegister (JSON object storage with schema validation)
    Frontend: Vue 2.7 + Pinia stores querying OpenRegister API directly
    Backend: Minimal — SettingsController + SettingsService for register setup, workflow orchestration
    Standards: Akoma Ntoso, ORI API, Gemeentewet, Wet digitaal vergaderen, Woo, MDTO, TOOI, DMN, BPMN, WCAG 2.1

  Shared specs: See ../openspec/specs/ for cross-project conventions
  Project guidelines: See ../project.md for workspace-wide standards

rules:
  proposal:
    - Reference shared nextcloud-app spec for app structure requirements
    - Consider impact on other Conduction apps
    - Validate governance workflow requirements against all 5 domains
  specs:
    - Use Schema.org type annotations for all entities (Event, Action, VoteAction, etc.)
    - Use Akoma Ntoso vocabulary for legislative document elements
    - Specify which Nextcloud OCP interfaces are used for integration features
    - Include ORI API field mappings for public-facing entities
  design:
    - Uses OpenRegister API directly from frontend (no own backend CRUD)
    - Register config in lib/Settings/decidesk_register.json (OpenAPI 3.0.0 format)
    - Imported via ConfigurationService::importFromApp() in repair step
    - Workflow state machines defined as OpenRegister metadata
    - Each governance domain has a configurable workflow template
  tasks:
    - Test with OpenRegister to verify schema validation works
    - Test workflow transitions for each governance domain
    - Validate ORI API output format against specification
    - Test WCAG 2.1 AA compliance for all voting interfaces
  review:
    - Cross-reference shared specs (nextcloud-app, api-patterns, nl-design, docker)
    - Flag spec deviations with WARNING and justification
    - Verify standards compliance (Akoma Ntoso, ORI, Woo, MDTO, TOOI)
    - Check that all 5 governance domains are supported by the feature
