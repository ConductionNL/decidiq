# app-tests.yml — decidesk caller for the reusable feature-test workflow.
#
# Runs the PHASE-5 testing layers on every PR to the protected branches.
# phpunit-unit + l10n-check HARD-GATE; e2e/newman are scaffolded and opt-in
# (run-e2e / run-newman) until the NC service container is wired (see tests.yml
# TODOs). Additive — sits alongside the existing release/quality workflows.

name: app-tests

on:
  pull_request:
    branches:
      - development
      - main
      - beta
  workflow_dispatch:
    inputs:
      run-e2e:
        type: boolean
        default: false
      run-newman:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  tests:
    uses: ./.forgejo/workflows/tests.yml
    with:
      app-id: decidesk
      # The deep-e2e / Newman jobs in the reusable are SCAFFOLDED (need a live
      # NC — see tests.yml TODOs) and stay opt-in. They are gated by the
      # LIVE-NC caller (app-tests-live.yml), so on this bare-gates caller they
      # are always off. Passing plain literals (not
      # `${{ github.event.inputs.* == 'true' }}`) is what app-tests-live.yml
      # does and what compiles: on a `pull_request` event
      # `github.event.inputs` is null, and feeding that null-deref expression
      # into the reusable's boolean-typed inputs made the caller fail to
      # compile ("Failing after 0s" — file-level, no job dispatched).
      run-e2e: false
      run-newman: false
