name: Code Quality

on:
  push:
    branches: [main, development, feature/**, bugfix/**, hotfix/**]
  pull_request:
    branches: [main, master, development, beta]
  workflow_dispatch:

jobs:
  quality:
    uses: ConductionNL/.github/.github/workflows/quality.yml@main
    with:
      app-name: decidesk
      php-version: "8.3"
      php-test-versions: '["8.3", "8.4"]'
      nextcloud-test-refs: '["stable31", "stable32"]'
      enable-psalm: true
      enable-phpstan: true
      enable-phpmetrics: true
      enable-frontend: true
      enable-eslint: true
      enable-phpunit: true
      enable-newman: true
      # openregister is a HARD dependency of the integration server, not an
      # optional one: since the AppHost adoption, lib/Controller/DashboardController
      # `extends \OCA\OpenRegister\AppHost\Controller\GenericDashboardController`.
      # Nextcloud's router ReflectionClass()es every controller while MATCHING a
      # route, so with openregister absent that one unresolvable parent class
      # makes EVERY decidesk endpoint return 500 — not just the dashboard one.
      # Without this input the Newman run 500s on its very first request.
      additional-apps: '[{"repo":"ConductionNL/openregister","app":"openregister","ref":"main"}]'
      enable-sbom: true
